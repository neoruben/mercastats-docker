{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "mercastats.metadata" (dict "context" $ "name" (include "mercastats.serviceAccountName" .) "labels" .Values.serviceAccount.labels "annotations" .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}

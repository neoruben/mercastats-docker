{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  {{- include "mercastats.metadata" (dict "context" $ "component" "server") | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mercastats.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $np.ingress.from }}
      from:
        {{- include "mercastats.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
    {{- if .Values.tests.enabled }}
    # Pod de `helm test`.
    - ports:
        - port: http
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "mercastats.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
    {{- end }}
    {{- with $np.ingress.extraRules }}
    {{- include "mercastats.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- if $np.egress.enabled }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with $np.egress.allowedPorts }}
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with $np.egress.extraRules }}
    {{- include "mercastats.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

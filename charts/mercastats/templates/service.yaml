{{- if .Values.service.enabled }}
{{- $svc := .Values.service }}
apiVersion: v1
kind: Service
metadata:
  {{- include "mercastats.metadata" (dict "context" $ "component" "server" "labels" $svc.labels "annotations" $svc.annotations) | nindent 2 }}
spec:
  type: {{ $svc.type }}
  {{- with $svc.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- if and (eq $svc.type "LoadBalancer") $svc.loadBalancerIP }}
  loadBalancerIP: {{ $svc.loadBalancerIP }}
  {{- end }}
  {{- if and (eq $svc.type "LoadBalancer") $svc.loadBalancerClass }}
  loadBalancerClass: {{ $svc.loadBalancerClass }}
  {{- end }}
  {{- if and (eq $svc.type "LoadBalancer") $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $svc.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and (has $svc.type (list "LoadBalancer" "NodePort")) $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
  {{- end }}
  {{- with $svc.internalTrafficPolicy }}
  internalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $svc.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $svc.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $svc.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $svc.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    - name: {{ $svc.portName }}
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
      {{- with $svc.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
      {{- if and (has $svc.type (list "LoadBalancer" "NodePort")) $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
  selector:
    {{- include "mercastats.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}

{{- if not .Values.existingSecret }}
{{- $c := .Values.config }}
apiVersion: v1
kind: Secret
metadata:
  {{- include "mercastats.metadata" (dict "context" $ "component" "server") | nindent 2 }}
type: Opaque
data:
  {{- with $c.auth.adminPassword }}
  {{ $.Values.secretKeys.adminPassword }}: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- if and $c.imap.enabled $c.imap.password }}
  {{ .Values.secretKeys.imapPassword }}: {{ $c.imap.password | toString | b64enc | quote }}
  {{- end }}
  {{- if and $c.gmail.enabled $c.gmail.clientSecret }}
  {{ .Values.secretKeys.gmailClientSecret }}: {{ $c.gmail.clientSecret | toString | b64enc | quote }}
  {{- end }}
{{- end }}

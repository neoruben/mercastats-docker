name: Publicar imagen Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Nombre fijo para que coincida con docker-compose.example.yml
  IMAGE_NAME: ${{ github.repository_owner }}/mercastats

jobs:
  test:
    name: Tests de core y server
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # La versión de Gradle la fija el wrapper del repositorio.
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar los tests
        run: ./gradlew :core:test :server:test --no-daemon

  docker:
    name: Construir y subir la imagen (amd64 y arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Lanzamiento manual desde una rama: publica con el nombre de la rama y el SHA
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

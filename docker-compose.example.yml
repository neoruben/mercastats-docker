# docker-compose.yml de MercaStats. Cópialo tal cual; tu configuración va en el archivo .env
# (plantilla en .env.example). Explicación completa en el README.
services:
  mercastats:
    image: ghcr.io/neoruben/mercastats:latest
    container_name: mercastats
    restart: unless-stopped
    ports:
      # Puerto del equipo : puerto del contenedor. Cambia el primero si el 8080 está ocupado.
      - "8080:8080"
    env_file:
      # Lee la configuración del .env de esta carpeta (si no existe, arranca igual)
      - path: .env
        required: false
    volumes:
      # Base de datos y carpeta vigilada (data/inbox). Se crea sola.
      - ./data:/data
